<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Navidad - De Bogarth</title>
    <!-- Importación de fuentes de Google Fonts: Cursiva elegante, Gótica y texto legible -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    
    <style>
        /* Estilos generales y fondo festivo */
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #b3000c 0%, #5c0006 100%);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* Efecto de nieve cayendo en el fondo */
        .snow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .snowflake {
            position: absolute;
            top: -10px;
            color: white;
            font-size: 1.5em;
            user-select: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh);
            }
        }

        /* Tarjeta Navideña */
        .card {
            background: #fffdf7;
            max-width: 600px;
            width: 100%;
            border-radius: 25px;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            z-index: 2;
            /* Bordes súper decorados */
            border: 8px solid #d4af37;
            outline: 4px dashed #165b33;
            outline-offset: -15px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 25px rgba(212, 175, 55, 0.5);
        }

        /* Decoraciones en las esquinas */
        .corner-decor {
            position: absolute;
            font-size: 2.5rem;
        }
        .top-left { top: 15px; left: 20px; }
        .top-right { top: 15px; right: 20px; }
        .bottom-left { bottom: 15px; left: 20px; }
        .bottom-right { bottom: 15px; right: 20px; }

        /* Imágenes decorativas de Navidad */
        .header-icons {
            font-size: 2.2rem;
            margin-bottom: 10px;
            letter-spacing: 10px;
        }

        /* Imagen local de Navidad */
        .navidad-img {
            width: 85%;
            max-width: 350px;
            height: auto;
            border-radius: 15px;
            border: 4px solid #bb2528;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            margin: 15px auto;
            display: block;
        }

        /* Mensaje principal con letra súper bonita */
        .mensaje {
            font-family: 'Great Vibes', cursive;
            font-size: 3.2rem;
            color: #bb2528;
            line-height: 1.3;
            margin: 25px 0;
            text-shadow: 1px 1px 2px rgba(212, 175, 55, 0.4);
        }

        /* Firma con letra gótica */
        .firma {
            font-size: 1.5rem;
            color: #165b33;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .nombre-gotico {
            font-family: 'UnifrakturMaguntia', cursive;
            font-size: 3rem;
            color: #111111;
            letter-spacing: 2px;
            display: inline-block;
            margin-left: 8px;
            text-shadow: 2px 2px 0px #d4af37;
        }

        /* Botón de regalo */
        .btn-regalo {
            background: linear-gradient(45deg, #165b33, #23884e);
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            padding: 15px 35px;
            border: 3px solid #d4af37;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(22, 91, 51, 0.4);
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }

        .btn-regalo:hover {
            transform: scale(1.08);
            background: linear-gradient(45deg, #bb2528, #e03135);
            box-shadow: 0 10px 25px rgba(187, 37, 40, 0.6);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        /* Contenedor del GIF oculto */
        #regalo-container {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #fff3d1;
            border-radius: 15px;
            border: 3px dashed #bb2528;
            animation: fadeIn 0.8s ease-in-out;
        }

        #regalo-container img {
            max-width: 100%;
            width: 300px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsivo para celulares */
        @media (max-width: 480px) {
            .mensaje { font-size: 2.5rem; }
            .nombre-gotico { font-size: 2.4rem; }
            .card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <!-- Contenedor de nieve animada -->
    <div class="snow-container" id="snow"></div>

    <div class="card">
        <!-- Adornos de esquinas -->
        <span class="corner-decor top-left">🎄</span>
        <span class="corner-decor top-right">🎄</span>
        <span class="corner-decor bottom-left">🎁</span>
        <span class="corner-decor bottom-right">🎁</span>

        <!-- Iconos navideños superiores -->
        <div class="header-icons">✨🎅🔔🦌❄️✨</div>

        <!-- Tu imagen de navidad (Asegúrate de que la extensión sea .jpg o .png según tu archivo) -->
        <img src="imagen navidad.jpg" alt="Feliz Navidad" class="navidad-img">

        <!-- Mensaje principal -->
        <div class="mensaje">
            "Te deseo una feliz navidad, te amo mucho amiguit@, que no se te olvide"
        </div>

        <!-- Firma -->
        <div class="firma">
            atte: <span class="nombre-gotico">Bogarth</span>
        </div>

        <!-- Botón interactivo -->
        <button class="btn-regalo" onclick="abrirRegalo()">🎁 Abre tu regalo 🎁</button>

        <!-- Regalo oculto (GIF) -->
        <div id="regalo-container">
            <h3 style="color: #bb2528; margin-top: 0;">🎉 ¡Sorpresa! 🎉</h3>
            <img src="Gif minion.gif" alt="Regalo Minion">
        </div>
    </div>

    <script>
        // Función para mostrar el GIF al hacer clic
        function abrirRegalo() {
            const regalo = document.getElementById('regalo-container');
            regalo.style.display = 'block';
            // Desplazar suavemente hacia el regalo
            regalo.scrollIntoView({ behavior: 'smooth' });
        }

        // Script para generar copos de nieve cayendo
        const snowContainer = document.getElementById('snow');
        const snowflakes = ['❄️', '❅', '❆', '✨'];

        for (let i = 0; i < 35; i++) {
            let flake = document.createElement('div');
            flake.className = 'snowflake';
            flake.innerText = snowflakes[Math.floor(Math.random() * snowflakes.length)];
            flake.style.left = Math.random() * 100 + 'vw';
            flake.style.animationDuration = (Math.random() * 4 + 3) + 's';
            flake.style.animationDelay = Math.random() * 5 + 's';
            flake.style.opacity = Math.random();
            flake.style.fontSize = (Math.random() * 15 + 12) + 'px';
            snowContainer.appendChild(flake);
        }
    </script>

</body>
</html>
